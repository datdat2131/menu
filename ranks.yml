# ======================================================================
#  /rank - xem quyền lợi các rank. Sửa xong gõ /astraxmenu reload.
#
#  Plugin tự ĐỌC kit của PlayerKits2 (plugins/PlayerKits2/kits/<kit>.yml) để
#  hiện đúng vật phẩm trong từng kit (chỉ đọc, không sửa).
#  Thứ tự rank bên dưới là THẤP -> CAO (Pro ... Apex).
#  >>> Rank Pro lấy từ kit thật của bạn. Các rank còn lại là MẪU: sửa giá, quyền lợi, tên kit. <<<
#
#  Mỗi rank:
#    label        tên thường (dùng trong tin nhắn)
#    name         tên hiển thị trong GUI. {g:pro} = glyph tag Pro (xem config.yml > glyphs)
#    model        (tùy chọn) item_model riêng, vd oraxen:xxx. Bỏ trống = dùng icon bên dưới
#    icon         vật phẩm làm biểu tượng (quặng / vàng / kim cương...)
#    kit          tên kit trong /kit ("" = rank không có kit)
#    permission   quyền coi là "đang có rank" (mặc định group.<id> của LuckPerms)
# ======================================================================
settings:
  title: "&8✦ &6&lʀᴀɴᴋ &8✦ &7ǫᴜʏềɴ ʟợɪ"
  detail-title: "&8Rank: {rank}"
  rows: 4
  slots: [10, 11, 12, 14, 15, 16]
  detail-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  default-rank-name: "&7Thành viên"
  back-menu: main
  kit-command: "kit {kit}"
  require-owned-to-claim: true
  show-kit-contents: true
  claim-material: EMERALD
  kits-folder: "PlayerKits2/kits"   # tính từ thư mục plugins/

texts:
  status-current: "&6★ Rank hiện tại của bạn"
