# ======================================================================
#  MENU GUI - AstraxBox. Sửa xong: /astraxmenu reload  |  kiểm tra liên kết: /astraxmenu check
#
#  Mỗi menu:  title, rows (1-6), filler (true/false), items
#  Mỗi nút:   slot (hoặc slots: [..]), material, name, lore, glow, amount,
#             skull-owner (PLAYER_HEAD), actions (mọi click), left-actions / right-actions
#  MODEL:     model: oraxen:xxx (item_model) | oraxen: <id> (lấy item Oraxen) | custom-model-data: 1001
#
#  Hành động (mỗi dòng "[loại] nội dung"):
#    [player] lệnh   [console] lệnh   [open] menu   [rank] [id]   [book] id   [close]
#    [message] chữ   [sound] key      [link] url | chữ
#    [cost-points] số   trừ poin (PlayerPoints); không đủ thì DỪNG, các dòng sau không chạy
#  Biến: {player} {online} {max} {rank} {points} và PlaceholderAPI (%...%)
#  Số ô: hàng 1 = 0-8, hàng 2 = 9-17, ... hàng 6 = 45-53.
#  Chữ in hoa nhỏ: ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ (copy dán thẳng vào name/title).
# ======================================================================
